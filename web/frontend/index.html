<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FDFBF7" />
  <title>家长学习管理台</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header id="app-header">
      <button class="app-back" aria-label="返回">‹</button>
      <div class="app-title">家长学习管理台</div>
      <div class="app-header-spacer"></div>
    </header>

    <!-- 页面内容 -->
    <main id="app-content"></main>

    <!-- 底部 Tab -->
    <nav id="tab-bar">
      <a class="tab-item" data-path="today" href="#/today">
        <span class="tab-icon">📅</span>
        <span class="tab-text">今日</span>
      </a>
      <a class="tab-item" data-path="records" href="#/records">
        <span class="tab-icon">📋</span>
        <span class="tab-text">记录</span>
      </a>
      <a class="tab-item" data-path="profile" href="#/profile">
        <span class="tab-icon">👤</span>
        <span class="tab-text">我的</span>
      </a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
